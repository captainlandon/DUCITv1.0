name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  # Governance/domain layer: pure Kotlin/JVM, no Android SDK required.
  # This job MUST stay fast and MUST stay green without any device or
  # emulator — Verbal Reference Implementation v1.0, section 5: "Pure
  # Kotlin domain layer; JVM-testable without Android."
  domain-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Run domain-model and domain-policy unit tests
        run: ./gradlew :core:domain-model:test :core:domain-policy:test --no-daemon
      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: domain-test-reports
          path: |
            core/domain-model/build/reports/tests
            core/domain-policy/build/reports/tests

  # Full Android build: app + Room module. Requires the Android SDK and a
  # route to Google's Maven repository, which the sandbox that authored
  # this workflow did not have (see docs/adr/ADR-00-build-environment.md)
  # — this job is the first real verification that :app and
  # :core:data-local compile.
  android-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
      - name: Assemble debug APK
        run: ./gradlew :app:assembleDebug --no-daemon
      - name: Run Room/data-local unit tests
        run: ./gradlew :core:data-local:test --no-daemon
      - name: Lint
        run: ./gradlew :app:lintDebug --no-daemon
      - name: Upload debug APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ducit-debug-apk
          path: app/build/outputs/apk/debug/*.apk
