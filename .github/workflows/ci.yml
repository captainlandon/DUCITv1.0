name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  # Governance/domain layer: pure Kotlin/JVM, no Android SDK required.
  # This job MUST stay fast and MUST stay green without any device or
  # emulator — Verbal Reference Implementation v1.0, section 5: "Pure
  # Kotlin domain layer; JVM-testable without Android."
  domain-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Run domain-model and domain-policy unit tests
        run: ./gradlew :core:domain-model:test :core:domain-policy:test --no-daemon
      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: domain-test-reports
          path: |
            core/domain-model/build/reports/tests
            core/domain-policy/build/reports/tests

  # Full Android build: app + Room module. Requires the Android SDK and a
  # route to Google's Maven repository, which the sandbox that authored
  # this workflow did not have (see docs/adr/ADR-00-build-environment.md)
  # — this job is the first real verification that :app and
  # :core:data-local compile.
  android-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      # ubuntu-latest ships with an Android SDK preinstalled (ANDROID_HOME
      # is already set) — we only need to accept licenses and make sure
      # this project's exact compileSdk/build-tools are present.
      # `android-actions/setup-android@v3` is deliberately NOT used here:
      # it tries to install the legacy `tools` package, which Google
      # removed from the SDK repository, so the action fails outright
      # with "Failed to find package 'tools'" before the build even
      # starts (see docs/adr/ADR-00-build-environment.md for how this was
      # diagnosed).
      - name: Accept Android SDK licenses and install required packages
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0"
      - name: Assemble debug APK
        run: ./gradlew :app:assembleDebug --no-daemon
      - name: Run Room/data-local unit tests
        run: ./gradlew :core:data-local:test --no-daemon
      - name: Lint
        run: ./gradlew :app:lintDebug --no-daemon
      - name: Upload debug APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ducit-debug-apk
          path: app/build/outputs/apk/debug/*.apk
